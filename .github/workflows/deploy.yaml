name: Deploy kafkamanager

on:
  push:
    branches:
      - main
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:
    inputs:
      requestedTag:
        description: Kafka-manager tag for versjonen du ønsker å deploye (tom gir nyeste versjon)
        type: string
        required: false

permissions: {}

concurrency:
  group: deploy-kafkamanager
  cancel-in-progress: false

jobs:
  resolve-image:
    name: Velg Kafka Manager-versjon
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
    outputs:
      image: ${{ steps.version.outputs.image }}
      shouldDeployTag: ${{ steps.version.outputs.shouldDeployTag }}
      shouldDeploy: ${{ steps.version.outputs.shouldDeploy }}
    steps:
      - name: Avgjør om vi skal deploye og i så fall hvilken versjon
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          requestedTag: ${{ inputs.requestedTag }}
        shell: bash
        run: |
          set -euo pipefail

          validate_tag() {
            if [[ ! "$1" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]{2}\.[0-9]{2}-[0-9a-f]{7}$ ]]; then
              local escapedTag="${1//%/%25}"
              escapedTag="${escapedTag//$'\r'/%0D}"
              escapedTag="${escapedTag//$'\n'/%0A}"
              echo "::error::Ugyldig Kafka-manager versjons-tag '$escapedTag'"
              exit 1
            fi
          }

          load_previously_deployed_tag() {
            local artifact_id
            # Bare artefakter fra main i dette repoet, ikke fra forks.
            artifact_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?name=kafkamanager-prod-tag&per_page=100" |
              jq -sr '[.[].artifacts[] | select(.name == "kafkamanager-prod-tag" and .expired == false
                and .workflow_run.head_branch == "main"
                and .workflow_run.head_repository_id == .workflow_run.repository_id)]
                | max_by([.created_at, .id]).id // empty') || return $?
            if [[ -n "$artifact_id" ]]; then
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/kafkamanager-prod-tag.zip" || return $?
              unzip -p "$RUNNER_TEMP/kafkamanager-prod-tag.zip" tag.txt
            else
              echo "::notice::Fant ingen lagret versjons-tag fra tidligere deploy." >&2
            fi
          }

          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$requestedTag" ]]; then
            validate_tag "$requestedTag"
            shouldDeploy=true
            shouldDeployTag="$requestedTag"
          else
            latestVersionTag=$(gh api repos/navikt/kafka-manager/releases/latest --jq '.tag_name')
            previouslyDeployedTag=$(load_previously_deployed_tag)
            if [[ "$GITHUB_EVENT_NAME" == schedule && "$latestVersionTag" == "$previouslyDeployedTag" ]]; then
                shouldDeploy=false
            else
              shouldDeploy=true
              shouldDeployTag="$latestVersionTag"
            fi
          fi

          {
            printf 'shouldDeploy=%s\n' "$shouldDeploy"
            if [[ "$shouldDeploy" == true ]]; then
              printf 'shouldDeployTag=%s\n' "$shouldDeployTag"
              printf 'image=europe-north1-docker.pkg.dev/nais-management-233d/poao/kafka-manager:%s\n' "$shouldDeployTag"
            fi
          } >> "$GITHUB_OUTPUT"
        
          {
            printf 'shouldDeploy: `%s`\n' "$shouldDeploy"
            if [[ "$shouldDeploy" == true ]]; then
              printf 'Kafka-manager versjon: `%s`\n' "$shouldDeployTag"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-kafkamanager-to-dev:
    name: Deploy kafkamanager to dev
    needs: resolve-image
    if: needs.resolve-image.outputs.shouldDeploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais-dev.yaml
          VAR: image=${{ needs.resolve-image.outputs.image }}

  deploy-kafkamanager-to-prod:
    name: Deploy kafkamanager to prod
    needs: [resolve-image, deploy-kafkamanager-to-dev]
    outputs:
      shouldDeployTag: ${{ needs.resolve-image.outputs.shouldDeployTag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: nais-prod.yaml,alerts.yaml
          VAR: image=${{ needs.resolve-image.outputs.image }}

  save-image-tag:
    name: Lagre prod-versjon
    needs: [deploy-kafkamanager-to-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Skriv prod-versjon
        env:
          shouldDeployTag: ${{ needs.deploy-kafkamanager-to-prod.outputs.shouldDeployTag }}
        run: printf '%s\n' "$shouldDeployTag" > tag.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kafkamanager-prod-tag
          path: tag.txt
          if-no-files-found: error
          retention-days: 90
          overwrite: true
